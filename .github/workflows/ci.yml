name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archivos que no se suben
        run: |
          if git ls-files | grep -E '^(\.env|\.venv/|PlantillaDocumentosSIC|Formulario.*\.pdf)'; then
            echo "Hay archivos que no se deben subir al repositorio."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q
